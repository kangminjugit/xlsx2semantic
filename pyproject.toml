[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xlsx2semantic"
version = "0.1.1"
description = "Transform XLSX files into LLM-friendly semantic XML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "kangminju" },
]
keywords = ["xlsx", "excel", "xml", "llm", "semantic", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]
cli = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
xlsx2semantic = "xlsx2semantic.cli:app"

[project.urls]
Homepage = "https://github.com/kangminjugit/xlsx2semantic"
Repository = "https://github.com/kangminjugit/xlsx2semantic"
Issues = "https://github.com/kangminjugit/xlsx2semantic/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
